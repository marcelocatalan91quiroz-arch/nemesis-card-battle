<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NÉMESIS Runtime Clean · Duel Lab</title><link rel="stylesheet" href="./lab.css"></head><body><main class="lab">
<h1>NÉMESIS Runtime Clean · Duelo 20 vs 20</h1>
<p>Mago Rojo vs Imperio Dragón. Fases e invocaciones sin js/game.js.</p>
<div class="controls">
<button id="start">Iniciar duelo</button>
<button id="draw">Robar turno</button>
<button id="phase">Avanzar fase</button>
<button id="normal">Invocación normal</button>
<button id="special-auth">Autorizar especial</button>
<button id="special">Invocación especial</button><button id="attack">Atacar</button>
<button id="end">Terminar turno</button>
<button id="reset">Reiniciar</button>
</div>
<div id="duel-summary" class="log"></div>
<div class="grid">
<section class="panel"><h2>Mago Rojo</h2><h3>Campo</h3><div id="player-field" class="card-strip"></div><h3>Mano</h3><div id="player-hand" class="card-strip"></div></section>
<section class="panel"><h2>Imperio Dragón</h2><h3>Campo</h3><div id="enemy-field" class="card-strip"></div><h3>Mano</h3><div id="enemy-hand" class="card-strip"></div></section>
</div>
</main><script type="module" src="./duel-lab.js"></script></body></html>
