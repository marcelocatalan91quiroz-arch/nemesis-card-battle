name: NEMESIS Runtime Clean Gate
on:
  push:
    branches: [ runtime-clean-phase1 ]
  workflow_dispatch:
jobs:
  runtime-clean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime-clean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
